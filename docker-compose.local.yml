# 本地开发覆盖配置:与 docker-compose.yml 叠加使用(仅改端口与网段)
# 背景:本机另有 crmeb_* 项目容器占用了 8011/33061/63791/9000 及 192.168.10.0/24 网段
# 用法:docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
services:
  mysql:
    ports: !override
      - "33062:3306"
    networks: !override
      app_net:
        ipv4_address: 192.168.20.11
  redis:
    ports: !override
      - "63792:6379"
    networks: !override
      app_net:
        ipv4_address: 192.168.20.10
  phpfpm:
    ports: !override
      - "9001:9000"
    networks: !override
      app_net:
        ipv4_address: 192.168.20.90
  swoole:
    ports: !override
      - "20108:20108"
    networks: !override
      app_net:
        ipv4_address: 192.168.20.91
  nginx:
    ports: !override
      - "8795:80"
    networks: !override
      app_net:
        ipv4_address: 192.168.20.80
networks: !override
  app_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.20.0/24
