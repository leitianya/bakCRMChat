name: 一键搬运 Compose 全部镜像到 GHCR

run-name: Compose镜像搬运-${{ inputs.source_ref }}-${{ inputs.compose_path }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Compose 所在分支、Tag 或 Commit；留空使用默认分支"
        required: false
        type: string
        default: ""
      compose_path:
        description: "Compose 相对路径；auto 自动查找"
        required: true
        type: string
        default: "auto"
      target_prefix:
        description: "GHCR 镜像名前缀；默认 none 不加前缀"
        required: false
        type: string
        default: "none"
      build_platforms:
        description: "本地镜像构建平台；CRMChat 建议 linux/amd64"
        required: true
        type: string
        default: "linux/amd64"
      skip_existing:
        description: "目标同名 Tag 已存在时跳过"
        required: true
        type: boolean
        default: true
      build_no_cache:
        description: "本地构建禁用缓存"
        required: true
        type: boolean
        default: false
      fail_on_missing_remote:
        description: "远程源镜像缺失时失败"
        required: true
        type: boolean
        default: true
      generate_ghcr_compose:
        description: "生成替换为 GHCR 的 Compose Artifact"
        required: true
        type: boolean
        default: true
      validate_crmchat_dependencies:
        description: "额外验证 CRMChat Composer、ThinkPHP、Swoole（不提交 vendor）"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: compose-images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    env:
      INPUT_REF: ${{ inputs.source_ref }}
      INPUT_COMPOSE: ${{ inputs.compose_path }}
      INPUT_PREFIX: ${{ inputs.target_prefix }}
      INPUT_PLATFORMS: ${{ inputs.build_platforms }}
      INPUT_SKIP: ${{ inputs.skip_existing }}
      INPUT_NO_CACHE: ${{ inputs.build_no_cache }}
      INPUT_FAIL_MISSING: ${{ inputs.fail_on_missing_remote }}
      INPUT_VALIDATE_APP: ${{ inputs.validate_crmchat_dependencies }}
      SOURCE_REGISTRY_USERNAME: ${{ secrets.SOURCE_REGISTRY_USERNAME }}
      SOURCE_REGISTRY_TOKEN: ${{ secrets.SOURCE_REGISTRY_TOKEN }}

    steps:
      - name: 手动检出源码（不触发损坏子模块清理）
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-${DEFAULT_BRANCH}}"
          echo "::add-mask::${TOKEN}"
          git init -q .
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --no-tags --depth 1 origin "refs/heads/${REF}:refs/remotes/origin/${REF}"; then
            git checkout -q --detach "refs/remotes/origin/${REF}"
          elif git fetch --no-tags --depth 1 origin "refs/tags/${REF}:refs/tags/${REF}"; then
            git checkout -q --detach "refs/tags/${REF}"
          elif git fetch --no-tags --depth 1 origin "${REF}"; then
            git checkout -q --detach FETCH_HEAD
          else
            echo "::error::无法检出：${REF}"; exit 1
          fi
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          echo "已检出 $(git rev-parse --short=12 HEAD)"
          git ls-files -s | awk '$1==160000 {print "::warning::发现损坏或未展开 Gitlink："$4"；镜像构建不会初始化它"}'

      - name: 安装 crane
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"

      - name: 准备 PHP 7.4（仅依赖验证时）
        if: ${{ inputs.validate_crmchat_dependencies }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          extensions: curl, json, bcmath, mbstring, openssl, simplexml, fileinfo
          coverage: none

      - name: CRMChat 依赖恢复与启动前验证（不提交 vendor）
        if: ${{ inputs.validate_crmchat_dependencies }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT="${RUNNER_TEMP}/crmchat-dependency-report.txt"
          :>"${REPORT}"
          [ -f crmchat/composer.json ] || { echo "::error::缺少 crmchat/composer.json"; exit 1; }
          [ -f crmchat/composer.lock ] || { echo "::error::缺少 crmchat/composer.lock"; exit 1; }
          echo "== Gitlink ==" | tee -a "$REPORT"
          git ls-files -s | awk '$1==160000 {print $2" "$4}' | tee -a "$REPORT"
          echo "== 锁文件关键依赖 ==" | tee -a "$REPORT"
          php -r '$l=json_decode(file_get_contents("crmchat/composer.lock"),true); foreach($l["packages"] as $p){if(in_array($p["name"],["alipaysdk/easysdk","xin/container","xin/helper"],true)){echo $p["name"]." ".$p["version"]." ".($p["source"]["reference"]??"no-reference").PHP_EOL;}}' | tee -a "$REPORT"
          if [ -e crmchat/vendor ]; then mv crmchat/vendor "${RUNNER_TEMP}/vendor-original"; fi
          composer install --working-dir=crmchat --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress 2>&1 | tee -a "$REPORT"
          test -f crmchat/vendor/autoload.php
          test -d crmchat/vendor/xin/container
          test -d crmchat/vendor/xin/helper
          for package in alipaysdk/easysdk xin/container xin/helper; do
            composer show --working-dir=crmchat "$package" --no-ansi 2>&1 | tee -a "$REPORT"
          done
          php -r '
            $installed=json_decode(file_get_contents("crmchat/vendor/composer/installed.json"),true);
            $packages=isset($installed["packages"])?$installed["packages"]:$installed;
            $seen=[];
            foreach($packages as $pkg){$seen[$pkg["name"]]=$pkg["version"] ?? "";}
            foreach(["alipaysdk/easysdk","xin/container","xin/helper"] as $name){
              if(!isset($seen[$name])){fwrite(STDERR,"installed package missing: {$name}".PHP_EOL);exit(1);}
              echo "installed ok: {$name} {$seen[$name]}".PHP_EOL;
            }
          ' | tee -a "$REPORT"
          php -r 'require "crmchat/vendor/autoload.php"; if(!interface_exists("Psr\Container\ContainerInterface")){exit(1);} echo "autoload ok".PHP_EOL;' | tee -a "$REPORT"
          (cd crmchat && php think list --raw >/dev/null)
          echo "ThinkPHP 命令加载通过" | tee -a "$REPORT"
          # setup-php 环境通常不安装 Swoole 扩展，只验证命令是否注册；缺扩展时记录警告，不伪装通过。
          if php -m | grep -qi '^swoole$'; then
            (cd crmchat && php think swoole --help >/dev/null)
            echo "Swoole 命令加载通过" | tee -a "$REPORT"
          else
            echo "Swoole 扩展未安装，运行级验证交由构建后的镜像完成" | tee -a "$REPORT"
          fi

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 解析 Compose
        id: compose
        shell: bash
        run: |
          set -euo pipefail
          if [ "${INPUT_COMPOSE}" = auto ] || [ -z "${INPUT_COMPOSE}" ]; then
            FILE=""
            for x in compose.yml compose.yaml docker-compose.yml docker-compose.yaml; do
              [ -f "$x" ] && FILE="$x" && break
            done
            if [ -z "$FILE" ]; then
              mapfile -t files < <(find . -maxdepth 4 -type f \( -name compose.yml -o -name compose.yaml -o -name docker-compose.yml -o -name docker-compose.yaml \) | sort)
              [ "${#files[@]}" -eq 1 ] || { printf '::error::Compose 数量=%s，请明确 compose_path\n' "${#files[@]}"; printf '%s\n' "${files[@]}"; exit 1; }
              FILE="${files[0]#./}"
            fi
          else
            FILE="${INPUT_COMPOSE#./}"
          fi
          [ -f "$FILE" ] || { echo "::error::Compose 不存在：$FILE"; exit 1; }
          DIR="$(dirname "$FILE")"
          docker compose --project-directory "$(realpath "$DIR")" -f "$(realpath "$FILE")" config --format json > "${RUNNER_TEMP}/compose.json"
          jq -e '.services and (.services|type=="object") and (.services|length>0)' "${RUNNER_TEMP}/compose.json" >/dev/null \
            || { echo "::error::Compose 中没有有效 services"; exit 1; }
          echo "Compose 文件：$FILE"
          echo "Compose 项目目录：$(realpath "$DIR")"
          echo "服务总数：$(jq '.services|length' "${RUNNER_TEMP}/compose.json")"
          echo "远程镜像服务数：$(jq '[.services[]|select(.build==null)]|length' "${RUNNER_TEMP}/compose.json")"
          echo "本地构建服务数：$(jq '[.services[]|select(.build!=null)]|length' "${RUNNER_TEMP}/compose.json")"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "json=${RUNNER_TEMP}/compose.json" >> "$GITHUB_OUTPUT"
          jq -r '.services|to_entries[]|"服务=\(.key) image=\(.value.image // "<无>") build=\(if .value.build then "是" else "否" end)"' "${RUNNER_TEMP}/compose.json"

      - name: 生成统一镜像计划
        id: plan
        env:
          JSON: ${{ steps.compose.outputs.json }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ -z "${INPUT_PREFIX}" ] || [ "${INPUT_PREFIX,,}" = none ]; then PREFIX=""; else PREFIX="${INPUT_PREFIX,,}"; fi
          jq --arg owner "$OWNER" --arg prefix "$PREFIX" '
            def safe: ascii_downcase|gsub("[^a-z0-9._-]+";"-")|gsub("^[._-]+|[._-]+$";"");
            [.services|to_entries[]|.key as $s|.value as $c|
             ($c.image // ("local-"+$s+":latest")) as $src|
             ($src|split("@")[0]|split("/")|last) as $last|
             ($last|if contains(":") then split(":")[0] else . end|safe) as $name|
             ($last|if contains(":") then split(":")|last else "latest" end) as $tag|
             {service:$s,source_image:$src,target_image:("ghcr.io/"+$owner+"/"+$prefix+$name+":"+$tag),build:($c.build//null)}]
          ' "$JSON" > "${RUNNER_TEMP}/services.json"
          jq 'sort_by(.source_image,.target_image)|group_by([.source_image,.target_image])|map(. as $g|($g|map(select(.build!=null))|first) as $b|{services:($g|map(.service)|unique),service:($b.service//$g[0].service),type:(if $b then "build" else "remote" end),source_image:$g[0].source_image,target_image:$g[0].target_image,build:($b.build//null)})' "${RUNNER_TEMP}/services.json" > "${RUNNER_TEMP}/plan.json"
          jq -e 'length>0' "${RUNNER_TEMP}/plan.json" >/dev/null

          # 不同 Registry 中同名、同 Tag 镜像可能映射到相同 GHCR 地址，必须阻止静默覆盖。
          conflicts="$(jq -r 'sort_by(.target_image)|group_by(.target_image)[]|select((map(.source_image)|unique|length)>1)|.[0].target_image' "${RUNNER_TEMP}/plan.json")"
          if [ -n "$conflicts" ]; then
            echo "::error::不同源镜像发生 GHCR 目标冲突，请设置 target_prefix 或调整 image 名称："
            printf '%s\n' "$conflicts"
            exit 1
          fi

          # 同一个 image 若由多个服务以不同 build 配置构建，不能擅自选择其中一个。
          build_conflicts="$(jq -r '
            sort_by(.source_image,.target_image)
            | group_by([.source_image,.target_image])[]
            | map(select(.build!=null))
            | select(length>1 and (map(.build)|unique|length)>1)
            | .[0].source_image
          ' "${RUNNER_TEMP}/services.json")"
          if [ -n "$build_conflicts" ]; then
            echo "::error::同一 image 存在多个不同 build 配置，无法安全决定构建来源："
            printf '%s\n' "$build_conflicts"
            exit 1
          fi

          count="$(jq length "${RUNNER_TEMP}/plan.json")"
          remote_count="$(jq '[.[]|select(.type=="remote")]|length' "${RUNNER_TEMP}/plan.json")"
          build_count="$(jq '[.[]|select(.type=="build")]|length' "${RUNNER_TEMP}/plan.json")"
          echo "镜像处理计划：总计=$count，远程搬运=$remote_count，本地构建=$build_count"
          jq -r '.[]|"[\(.type)] 服务=\(.services|join(",")) | \(.source_image) -> \(.target_image)"' "${RUNNER_TEMP}/plan.json"
          echo "file=${RUNNER_TEMP}/plan.json" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR 与源 Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN: ${{ steps.plan.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ -n "${SOURCE_REGISTRY_USERNAME}" ] || [ -n "${SOURCE_REGISTRY_TOKEN}" ]; then
            [ -n "${SOURCE_REGISTRY_USERNAME}" ] && [ -n "${SOURCE_REGISTRY_TOKEN}" ] || { echo "::error::两个源 Registry Secret 必须同时配置"; exit 1; }
            echo "::add-mask::${SOURCE_REGISTRY_TOKEN}"
            jq -r '.[]|select(.type=="remote")|.source_image' "$PLAN" | awk -F/ 'NF>1&&($1~/[.:]/||$1=="localhost"){print $1;next}{print "index.docker.io"}' | sort -u | while read -r r; do
              printf '%s' "$SOURCE_REGISTRY_TOKEN" | crane auth login "$r" -u "$SOURCE_REGISTRY_USERNAME" --password-stdin
              printf '%s' "$SOURCE_REGISTRY_TOKEN" | docker login "$r" -u "$SOURCE_REGISTRY_USERNAME" --password-stdin
            done
          fi

      - name: 搬运远程镜像
        env:
          PLAN: ${{ steps.plan.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0; skipped=0; missing=0; failed=0
          :>"${RUNNER_TEMP}/remote-summary.txt"
          while IFS=$'\t' read -r src dst; do
            [ -n "$src" ] || continue
            if [ "$INPUT_SKIP" = true ] && crane manifest "$dst" >/dev/null 2>&1; then echo "跳过已存在：$dst" | tee -a "${RUNNER_TEMP}/remote-summary.txt"; skipped=$((skipped+1)); continue; fi
            if ! crane manifest "$src" >/dev/null 2>&1; then echo "::warning::源镜像不存在或无权访问：$src" | tee -a "${RUNNER_TEMP}/remote-summary.txt"; missing=$((missing+1)); continue; fi
            if crane copy "$src" "$dst" && crane manifest "$dst" >/dev/null; then
              echo "成功：$src -> $dst" | tee -a "${RUNNER_TEMP}/remote-summary.txt"; ok=$((ok+1))
            else
              echo "::error::搬运失败：$src -> $dst" | tee -a "${RUNNER_TEMP}/remote-summary.txt"; failed=$((failed+1))
            fi
          done < <(jq -r '.[]|select(.type=="remote")|[.source_image,.target_image]|@tsv' "$PLAN")
          echo "远程镜像汇总：成功=$ok 跳过=$skipped 缺失=$missing 失败=$failed"
          if [ "$INPUT_FAIL_MISSING" = true ] && [ "$missing" -gt 0 ]; then exit 1; fi
          [ "$failed" -eq 0 ]

      - name: 构建本地 Dockerfile 镜像
        env:
          PLAN: ${{ steps.plan.outputs.file }}
          COMPOSE_DIR: ${{ steps.compose.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          :>"${RUNNER_TEMP}/skipped.txt"
          :>"${RUNNER_TEMP}/build-summary.txt"
          while IFS= read -r item; do
            service="$(jq -r .service <<<"$item")"
            services="$(jq -r '.services|join(",")' <<<"$item")"
            dst="$(jq -r .target_image <<<"$item")"
            context="$(jq -r '.build.context // "."' <<<"$item")"
            dockerfile="$(jq -r '.build.dockerfile // "Dockerfile"' <<<"$item")"
            target_stage="$(jq -r '.build.target // empty' <<<"$item")"
            [[ "$context" = /* ]] || context="$COMPOSE_DIR/$context"
            context="$(realpath "$context")"
            [[ "$dockerfile" = /* ]] || dockerfile="$context/$dockerfile"
            dockerfile="$(realpath "$dockerfile")"
            [ -d "$context" ] || { echo "::error::构建上下文不存在：$context"; exit 1; }
            [ -f "$dockerfile" ] || { echo "::error::Dockerfile 不存在：$dockerfile"; exit 1; }
            echo "构建服务组：$services"
            echo "构建上下文：$context"
            echo "Dockerfile：$dockerfile"
            echo "构建平台：$INPUT_PLATFORMS"
            [ -n "$target_stage" ] && echo "构建阶段：$target_stage"
            if [ "$INPUT_SKIP" = true ] && crane manifest "$dst" >/dev/null 2>&1; then
              echo "跳过已存在：$dst"
              printf '跳过（目标已存在）：%s -> %s\n' "$services" "$dst" >> "${RUNNER_TEMP}/build-summary.txt"
              continue
            fi
            args=(docker buildx build --platform "$INPUT_PLATFORMS" -f "$dockerfile" -t "$dst" --push)
            [ "$INPUT_NO_CACHE" = true ] && args+=(--no-cache)
            [ -n "$target_stage" ] && args+=(--target "$target_stage")
            while IFS=$'\t' read -r k v; do [ -n "$k" ] && args+=(--build-arg "$k=$v"); done < <(jq -r '.build.args//{}|to_entries[]?|[.key,(.value|tostring)]|@tsv' <<<"$item")
            while IFS= read -r label; do [ -n "$label" ] && args+=(--label "$label"); done < <(jq -r '.build.labels//{}|to_entries[]?|"\(.key)=\(.value)"' <<<"$item")
            log="${RUNNER_TEMP}/build-${service}.log"
            set +e; "${args[@]}" "$context" 2>&1 | tee "$log"; rc=${PIPESTATUS[0]}; set -e
            if [ "$rc" -ne 0 ]; then
              if grep -Eqi 'no match for platform in manifest|no matching manifest|no match for platform' "$log"; then
                echo "::warning::${services} 平台不支持，已跳过并继续"
                jq -r '.services[]' <<<"$item" >> "${RUNNER_TEMP}/skipped.txt"
                printf '跳过（平台不支持）：%s -> %s\n' "$services" "$dst" >> "${RUNNER_TEMP}/build-summary.txt"
                continue
              fi
              exit "$rc"
            fi
            crane manifest "$dst" >/dev/null
            echo "构建成功：${services} -> $dst"
            printf '成功：%s -> %s\n' "$services" "$dst" >> "${RUNNER_TEMP}/build-summary.txt"
          done < <(jq -c '.[]|select(.type=="build")' "$PLAN")
          sort -u "${RUNNER_TEMP}/skipped.txt" -o "${RUNNER_TEMP}/skipped.txt"
          echo "本地构建汇总："
          if [ -s "${RUNNER_TEMP}/build-summary.txt" ]; then cat "${RUNNER_TEMP}/build-summary.txt"; else echo "没有本地 build 镜像"; fi
          echo "平台不支持而跳过的服务数：$(wc -l < "${RUNNER_TEMP}/skipped.txt" | xargs)"

      - name: 生成 GHCR Compose
        if: ${{ inputs.generate_ghcr_compose }}
        env:
          PLAN: ${{ steps.plan.outputs.file }}
          JSON: ${{ steps.compose.outputs.json }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/compose-ghcr-output"; mkdir -p "$OUT"
          cp "$PLAN" "$OUT/image-plan.json"
          cp "$JSON" "$OUT/compose.resolved.json"
          printf '%s\n' "${GITHUB_SHA}" > "$OUT/workflow-source-commit.txt"
          [ -f "${RUNNER_TEMP}/remote-summary.txt" ] && cp "${RUNNER_TEMP}/remote-summary.txt" "$OUT/remote-summary.txt"
          [ -f "${RUNNER_TEMP}/build-summary.txt" ] && cp "${RUNNER_TEMP}/build-summary.txt" "$OUT/build-summary.txt"
          [ -f "${RUNNER_TEMP}/crmchat-dependency-report.txt" ] && cp "${RUNNER_TEMP}/crmchat-dependency-report.txt" "$OUT/crmchat-dependency-report.txt"
          jq -R -s 'split("\n")|map(select(length>0))' "${RUNNER_TEMP}/skipped.txt" > "$OUT/skipped-build-services.json"
          jq --slurpfile p "$PLAN" --slurpfile sk "$OUT/skipped-build-services.json" 'reduce ($p[0][]) as $i (.; reduce ($i.services[]) as $s (.; if ($sk[0]|index($s))!=null then . else .services[$s].image=$i.target_image | if $i.type=="build" then del(.services[$s].build) else . end end))' "$JSON" > "$OUT/compose.ghcr.json"
          cat > "$OUT/README.txt" <<EOF
          来源仓库：${GITHUB_REPOSITORY}
          来源版本：${INPUT_REF:-${{ github.event.repository.default_branch }}}
          原 Compose：${{ steps.compose.outputs.file }}
          使用方法：docker compose -f compose.ghcr.json up -d
          平台不支持而跳过的服务见 skipped-build-services.json，跳过服务保留原 build/image 配置。
          镜像计划见 image-plan.json；远程搬运与本地构建汇总见对应 summary 文件。
          EOF

      - name: 上传诊断日志（任务失败时也保留）
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compose-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/remote-summary.txt
            ${{ runner.temp }}/build-summary.txt
            ${{ runner.temp }}/crmchat-dependency-report.txt
            ${{ runner.temp }}/build-*.log
            ${{ runner.temp }}/compose.json
            ${{ runner.temp }}/plan.json
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传结果
        if: ${{ inputs.generate_ghcr_compose }}
        uses: actions/upload-artifact@v4
        with:
          name: compose-ghcr-${{ github.run_number }}
          path: ${{ runner.temp }}/compose-ghcr-output
          if-no-files-found: error
          retention-days: 30
