server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    client_max_body_size 100M;

    root /var/www/public;

    location / {
        if (!-e $request_filename){
            rewrite  ^(.*)$  /index.php?s=$1  last;   break;
        }
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log off;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log off;
        access_log /dev/null;
    }

    # 消息发送接口必须走 swoole 常驻进程：KefuServices::sendMessage 强制 CLI SAPI，
    # 且消息实时推送依赖容器内的 SwooleTaskService（php-fpm 下会报“请在CLI模式下运行”）
    location ~ ^/api/(mobile|kefu)/service/send_message$ {
        proxy_pass http://swoole:20108;
        proxy_set_header Host $host;
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # WebSocket 反向代理：CRMChat 长连接由 swoole 容器提供（think-swoole，默认端口 20108）
    # 用于客服聊天、后台实时通知等业务
    location /ws {
        proxy_pass http://swoole:20108;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass phpfpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
